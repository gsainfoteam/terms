<!doctype html>
<html lang="{{ .Site.LanguageCode }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="bg-canvas min-h-screen">
    <div class="min-h-screen flex flex-col">
      <header class="bg-surface shadow-sm border-b border-line">
        <div
          class="max-w-4xl mx-auto px-4 py-4 sm:py-5 flex items-center gap-3 sm:gap-4"
        >
          <a
            href="{{ .Site.BaseURL }}"
            class="shrink-0 transition-opacity hover:opacity-70"
          >
            <img
              src="{{ .Site.BaseURL }}images/logo.svg"
              alt="{{ .Site.Title }}"
              class="logo h-8 sm:h-10 w-auto"
            />
          </a>
          <span class="h-5 w-px bg-line-strong" aria-hidden="true"></span>
          <p class="text-sm sm:text-base text-muted">
            서비스 약관 및 개인정보처리방침
          </p>
        </div>
      </header>

      <main class="flex-1">{{ block "main" . }}{{ end }}</main>

      <footer class="bg-surface border-t border-line mt-auto">
        <div class="max-w-4xl mx-auto px-4 py-6">
          <div class="text-center text-muted text-sm">
            <p>
              &copy; {{ now.Format "2006" }} {{ .Site.Title }}. All rights
              reserved.
            </p>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
