{{ define "main" }}
  <div class="max-w-5xl mx-auto px-4 py-8">
    <div class="bg-surface rounded-lg shadow-sm border border-line p-8">
      <!-- Header -->
      <div class="mb-8 pb-6 border-b border-line">
        <div
          class="flex flex-col md:flex-row md:items-center justify-between"
        >
          <h1 class="text-3xl font-bold text-fg">{{ .Title }}</h1>
          <div class="text-sm text-muted">
            {{ if .Date }}시행일: {{ .Date.Format "2006년 1월 2일" }}{{ end }}
          </div>
        </div>
        {{ if .Draft }}
        <div class="mt-3 text-sm text-danger">
          아직 작성중인 약관입니다. 아래 내용은 효력이 발생하지 않습니다.
        </div>
        {{ end }}
      </div>

      <!-- Content -->
      <div class="prose max-w-none">{{ .Content }}</div>

      <!-- Footer -->
      <div class="mt-12 pt-6 border-t border-line">
        <div class="flex items-center justify-between">
          <div class="text-sm text-muted">
            {{ if .Date }}
              최종 수정일:
              {{ .Date.Format "2006년 1월 2일" }}
            {{ end }}
          </div>
        </div>
      </div>
    </div>
  </div>
{{ end }}
