<!doctype html>
<html lang="{{ .Site.LanguageCode }}" data-theme="light">
  <head>
    <script>
      (function () {
        var theme = new URLSearchParams(location.search).get("theme");
        var root = document.documentElement;
        if (theme === "dark") root.setAttribute("data-theme", "dark");
        if (theme === "system" || theme === "auto") root.removeAttribute("data-theme");
        if (theme !== "auto") root.setAttribute("data-scheme", "none");
      })();
    </script>
    {{ partial "head.html" . }}
  </head>
  <body>
    {{ block "main" . }}{{ end }}
  </body>
</html>
