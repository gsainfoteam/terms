<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="{{ .Site.BaseURL }}favicon.svg" type="image/svg+xml" />
<title>{{ if .Title }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
<meta
  name="description"
  content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}"
/>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          canvas: "var(--canvas)",
          surface: "var(--surface)",
          fg: "var(--fg)",
          muted: "var(--fg-muted)",
          faint: "var(--fg-faint)",
          line: "var(--line)",
          "line-strong": "var(--line-strong)",
          danger: "var(--danger)",
        },
      },
    },
  };
</script>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-gov-dynamic-subset.min.css"
/>

<link rel="stylesheet" href="{{ .Site.BaseURL }}css/theme.css" />
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/markdown.css" />
<link rel="stylesheet" href="{{ .Site.BaseURL }}css/components.css" />
